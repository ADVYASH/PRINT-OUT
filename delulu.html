<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Music</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;

    font-family: Arial, Helvetica, sans-serif;

    background:
        radial-gradient(
            circle at center,
            #202025 0%,
            #0b0b0f 65%
        );

    color: white;
}


/* ================================
   PAGE
================================ */

.page {
    width: 100%;
    height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    text-align: center;
}

.content h1 {
    margin: 0;

    font-size: clamp(
        40px,
        7vw,
        80px
    );

    letter-spacing: -3px;
}

.content p {
    margin-top: 12px;
    color: #888;
}


/* ================================
   PLAYER
================================ */

.player {
    position: fixed;

    left: 50%;
    bottom: 24px;

    transform: translateX(-50%);

    width: min(
        700px,
        calc(100% - 30px)
    );

    min-height: 82px;

    padding: 12px 16px;

    display: flex;
    align-items: center;

    gap: 14px;

    background:
        rgba(25, 25, 30, .95);

    border:
        1px solid
        rgba(255,255,255,.1);

    border-radius: 20px;

    box-shadow:
        0 20px 60px
        rgba(0,0,0,.55);

    backdrop-filter:
        blur(20px);

    z-index: 100;
}


/* ================================
   ART
================================ */

.art {
    width: 52px;
    height: 52px;

    flex-shrink: 0;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 14px;

    background:
        linear-gradient(
            135deg,
            #ff0055,
            #7b2cff
        );

    font-size: 24px;
}


/* ================================
   INFORMATION
================================ */

.info {
    flex: 1;
    min-width: 0;
    text-align: left;
}

.title {
    font-size: 14px;

    font-weight: 600;

    margin-bottom: 8px;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}


/* ================================
   PROGRESS
================================ */

.progress {
    position: relative;

    width: 100%;
    height: 5px;

    background: #414147;

    border-radius: 20px;

    cursor: pointer;
}

.progress-fill {
    position: absolute;

    left: 0;
    top: 0;

    width: 0%;
    height: 100%;

    background: white;

    border-radius: inherit;
}


/* ================================
   TIME
================================ */

.time {
    margin-top: 5px;

    font-size: 9px;

    color: #777;
}


/* ================================
   CONTROLS
================================ */

.controls {
    display: flex;

    align-items: center;

    gap: 3px;

    flex-shrink: 0;
}

button {
    width: 40px;
    height: 40px;

    border: none;

    border-radius: 50%;

    background: transparent;

    color: white;

    cursor: pointer;

    font-size: 17px;

    display: flex;

    align-items: center;
    justify-content: center;
}

button:hover {
    background:
        rgba(255,255,255,.1);
}


/* ================================
   PLAY BUTTON
================================ */

.play {
    width: 46px;
    height: 46px;

    background: white;

    color: black;

    font-size: 18px;
}

.play:hover {
    background: #eeeeee;
}


/* ================================
   VOLUME BUTTONS
================================ */

.volume-button {
    font-size: 22px;

    font-weight: 300;
}


/* ================================
   MOBILE
================================ */

@media(max-width:600px) {

    .player {
        bottom: 12px;

        width:
            calc(100% - 20px);

        padding:
            9px 10px;

        gap: 7px;
    }

    .art {
        width: 44px;
        height: 44px;

        border-radius: 11px;
    }

    .controls {
        gap: 0;
    }

    .controls button:not(.play) {
        display: none;
    }

    /*
       Keep volume buttons visible
       on mobile.
    */

    .controls #volumeDown,
    .controls #volumeUp {
        display: flex;
    }

}

/* ================================
   LEFT NAVIGATION
================================ */

.side-nav {
    position: fixed;

    left: 20px;
    top: 50%;

    transform: translateY(-50%);

    display: flex;
    flex-direction: column;

    gap: 10px;

    z-index: 200;
}

.side-nav a {
    width: 110px;
    height: 44px;

    display: flex;
    align-items: center;
    justify-content: center;

    text-decoration: none;

    color: white;

    background: rgba(25, 25, 30, 0.95);

    border: 1px solid rgba(255,255,255,.1);

    border-radius: 12px;

    font-size: 14px;
    font-weight: 600;

    box-shadow:
        0 8px 25px rgba(0,0,0,.35);

    transition:
        background .2s,
        transform .2s;
}

.side-nav a:hover {
    background: rgba(255,255,255,.12);

    transform: translateX(3px);
}


/* Mobile */

@media(max-width:600px) {

    .side-nav {
        left: 10px;
    }

    .side-nav a {
        width: 90px;
        height: 40px;

        font-size: 13px;
    }

}

/* ================================
   MOVING WALLPAPER
================================ */

.wallpaper {
    position: fixed;

    inset: -30px;

    width: calc(100% + 60px);
    height: calc(100% + 60px);

    z-index: -2;

    background-image:
        linear-gradient(
            rgba(5, 5, 10, 0.45),
            rgba(5, 5, 10, 0.65)
        ),
        url("delulu.jpg");

    background-size: cover;
    background-position: center;

    background-repeat: no-repeat;

    transform:
        translate3d(0, 0, 0)
        scale(1.05);

    transition:
        transform 0.15s ease-out;

    will-change: transform;
}


/* Dark overlay */

.wallpaper-overlay {
    position: fixed;

    inset: 0;

    z-index: -1;

    background:
        radial-gradient(
            circle at center,
            rgba(20, 20, 30, 0.05),
            rgba(0, 0, 0, 0.55)
        );

    pointer-events: none;
}
</style>

</head>


<body>

<!-- ================================
     MOVING WALLPAPER
================================ -->

<div class="wallpaper" id="wallpaper"></div>

<div class="wallpaper-overlay"></div>
<!-- ================================
     LEFT NAVIGATION
================================ -->

<nav class="side-nav">

    <a href="index.html">
        🏠 Home
    </a>

    <a href="playlist.html">
        🎵 Playlist
    </a>

</nav>

<!-- ================================
     PAGE
================================ -->

<div class="page">

    <div class="content">

        <h1>डेलुलू</h1>
        <h1>रेडियो</h1>        

        <p>
            songs for situations that never happened 😭, 24/7.
        </p>

    </div>

</div>


<!-- ================================
     AUDIO
================================ -->

<audio
    id="audio"
    preload="metadata"
></audio>


<!-- ================================
     CUSTOM PLAYER
================================ -->

<div class="player">


    <!-- MUSIC ICON -->

    <div class="art">
        ♫
    </div>


    <!-- SONG INFORMATION -->

    <div class="info">

        <div
            class="title"
            id="title"
        >
            Select a song
        </div>


        <div
            class="progress"
            id="progress"
        >

            <div
                class="progress-fill"
                id="progressFill"
            ></div>

        </div>


        <div class="time">

            <span id="current">
                0:00
            </span>

            /

            <span id="duration">
                0:00
            </span>

        </div>

    </div>


    <!-- ================================
         CONTROLS

         THE VOLUME BUTTONS ARE HERE
    ================================= -->

    <div class="controls">


        <!-- PREVIOUS -->

        <button
            id="previous"
            title="Previous"
        >
            ⏮
        </button>


        <!-- PLAY -->

        <button
            id="play"
            class="play"
            title="Play / Pause"
        >
            ▶
        </button>


        <!-- NEXT -->

        <button
            id="next"
            title="Next"
        >
            ⏭
        </button>


        <!-- VOLUME DOWN -->

        <button
            id="volumeDown"
            class="volume-button"
            title="Volume Down"
        >
            −
        </button>


        <!-- VOLUME UP -->

        <button
            id="volumeUp"
            class="volume-button"
            title="Volume Up"
        >
            +
        </button>


    </div>

</div>


<script>


/* =========================================
   YOUR SONGS
========================================= */

const songs = [

    {
        title: "Tum Hi Ho",
        file: "dululu/Tum Hi Ho.mp3"
    },

    {
        title: "Kesariya",
        file: "dululu/Kesariya.mp3"
    },

    {
        title: "Apna Bana Le",
        file: "dululu/Apna Bana Le.mp3"
    },

    {
        title: "Heeriye",
        file: "dululu/Heeriye.mp3"
    },

    {
        title: "O Maahi",
        file: "dululu/O Maahi.mp3"
    }

];


/* =========================================
   ELEMENTS
========================================= */

const audio =
    document.getElementById("audio");

const playButton =
    document.getElementById("play");

const previousButton =
    document.getElementById("previous");

const nextButton =
    document.getElementById("next");

const volumeDown =
    document.getElementById("volumeDown");

const volumeUp =
    document.getElementById("volumeUp");

const title =
    document.getElementById("title");

const progress =
    document.getElementById("progress");

const progressFill =
    document.getElementById("progressFill");

const currentTime =
    document.getElementById("current");

const duration =
    document.getElementById("duration");


let currentSong = 0;


/* =========================================
   VOLUME
========================================= */

audio.volume = 0.7;


/* =========================================
   LOAD SONG
========================================= */

function loadSong(index) {

    currentSong = index;

    const song =
        songs[currentSong];

    title.textContent =
        song.title;

    audio.src =
        song.file;

    audio.load();

}


/* =========================================
   PLAY SONG
========================================= */

function playSong() {

    audio.play()
        .then(() => {

            playButton.textContent =
                "❚❚";

        })
        .catch(error => {

            console.error(
                "Could not play:",
                error
            );

            title.textContent =
                "MP3 file not found";

        });

}


/* =========================================
   PAUSE SONG
========================================= */

function pauseSong() {

    audio.pause();

    playButton.textContent =
        "▶";

}


/* =========================================
   PLAY BUTTON
========================================= */

playButton.addEventListener(
    "click",
    function() {

        if (audio.paused) {

            playSong();

        } else {

            pauseSong();

        }

    }
);


/* =========================================
   NEXT BUTTON
========================================= */

nextButton.addEventListener(
    "click",
    function() {

        currentSong++;

        if (
            currentSong >=
            songs.length
        ) {

            currentSong = 0;

        }

        loadSong(currentSong);

        playSong();

    }
);


/* =========================================
   PREVIOUS BUTTON
========================================= */

previousButton.addEventListener(
    "click",
    function() {

        currentSong--;

        if (
            currentSong < 0
        ) {

            currentSong =
                songs.length - 1;

        }

        loadSong(currentSong);

        playSong();

    }
);


/* =========================================
   AUTO NEXT
========================================= */

audio.addEventListener(
    "ended",
    function() {

        currentSong++;

        if (
            currentSong >=
            songs.length
        ) {

            currentSong = 0;

        }

        loadSong(currentSong);

        playSong();

    }
);


/* =========================================
   VOLUME DOWN
========================================= */

volumeDown.addEventListener(
    "click",
    function() {

        audio.volume =
            Math.max(
                0,
                audio.volume - 0.1
            );

    }
);


/* =========================================
   VOLUME UP
========================================= */

volumeUp.addEventListener(
    "click",
    function() {

        audio.volume =
            Math.min(
                1,
                audio.volume + 0.1
            );

    }
);


/* =========================================
   UPDATE PROGRESS
========================================= */

audio.addEventListener(
    "timeupdate",
    function() {

        if (
            !audio.duration
        ) {

            return;

        }

        const percentage =
            (
                audio.currentTime /
                audio.duration
            ) * 100;

        progressFill.style.width =
            percentage + "%";


        currentTime.textContent =
            formatTime(
                audio.currentTime
            );

    }
);


/* =========================================
   DURATION
========================================= */

audio.addEventListener(
    "loadedmetadata",
    function() {

        duration.textContent =
            formatTime(
                audio.duration
            );

    }
);


/* =========================================
   CLICK PROGRESS BAR
========================================= */

progress.addEventListener(
    "click",
    function(event) {

        if (
            !audio.duration
        ) {

            return;

        }

        const rect =
            progress.getBoundingClientRect();

        const percentage =
            (
                event.clientX -
                rect.left
            ) / rect.width;

        audio.currentTime =
            percentage *
            audio.duration;

    }
);


/* =========================================
   FORMAT TIME
========================================= */

function formatTime(seconds) {

    if (
        isNaN(seconds)
    ) {

        return "0:00";

    }

    const minutes =
        Math.floor(
            seconds / 60
        );

    const secs =
        Math.floor(
            seconds % 60
        );

    return (
        minutes +
        ":" +
        String(secs).padStart(
            2,
            "0"
        )
    );

}


/* =========================================
   START
========================================= */

loadSong(0);

/* =========================================
   MOUSE MOVING WALLPAPER
========================================= */

const wallpaper =
    document.getElementById("wallpaper");

document.addEventListener(
    "mousemove",
    function(event) {

        const x =
            (event.clientX /
            window.innerWidth) - 0.5;

        const y =
            (event.clientY /
            window.innerHeight) - 0.5;


        const moveX =
            x * 25;

        const moveY =
            y * 25;


        wallpaper.style.transform =
            `translate3d(${moveX}px, ${moveY}px, 0) scale(1.05)`;

    }
);
</script>

</body>
</html>
